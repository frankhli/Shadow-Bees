version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgis/postgis:15-3.4
    container_name: tiaohai-postgres
    environment:
      POSTGRES_USER: tiaohai
      POSTGRES_PASSWORD: tiaohai123
      POSTGRES_DB: tiaohai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiaohai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: tiaohai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Meilisearch (Search Engine)
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: tiaohai-meilisearch
    environment:
      MEILI_MASTER_KEY: your-meilisearch-master-key
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
